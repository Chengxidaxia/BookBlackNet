<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>阅读 · BookBlackNet</title>
<link rel="canonical" id="page-canonical" href="https://book.blacknet.cc.cd/read.html">
<!-- 阅读模式的「按行」信息：Firefox 阅读视图取 meta author 当署名，Safari 取 og:type -->
<meta name="author" id="page-author" content="群书阁">
<meta name="description" id="page-desc" content="群书阁 BookBlackNet —— 在线阅读与写作。">
<meta name="theme-color" content="#faf7f1">
<meta property="og:type" content="article">
<meta property="og:site_name" content="群书阁">
<meta property="og:title" id="og-title" content="阅读 · BookBlackNet">
<meta property="og:description" id="og-desc" content="">
<meta property="og:url" id="og-url" content="https://book.blacknet.cc.cd/read.html">
<meta property="article:published_time" id="og-pub" content="">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%239c3a2c'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='%23fff' font-family='serif'%3E书%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/write.css">
<link rel="stylesheet" href="assets/css/read.css">
</head>
<body class="reading">

<!-- 阅读工具条 -->
<header class="reader-bar" id="reader-bar">
  <a class="icon-btn" href="index.html" title="返回书库">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <div class="rb-title" id="rb-title">阅读</div>
  <div class="rb-progress"><i id="rb-progress"></i></div>
  <div class="spacer"></div>
  <button class="icon-btn" id="btn-toc" title="目录">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="3.5" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="3.5" cy="18" r="1.2" fill="currentColor" stroke="none"/></svg>
  </button>
  <button class="icon-btn" id="btn-font" title="排版" aria-label="排版">
    <span class="ico-aa"><b>A</b><i>a</i></span>
  </button>
  <button class="icon-btn" id="btn-theme" title="主题">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>
  </button>
</header>

<!-- 目录抽屉 -->
<aside class="toc" id="toc">
  <div class="toc-head">
    <span class="chap-label">目录</span>
    <span class="chap-count" id="toc-count"></span>
    <button class="icon-btn sm" id="btn-toc-close" title="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="toc-book">
    <div class="toc-cover" id="toc-cover">书</div>
    <div class="stack" style="min-width:0">
      <div class="toc-name" id="toc-name">—</div>
      <div class="small muted" id="toc-author">—</div>
      <a class="small" id="toc-link" href="index.html">书籍详情 →</a>
    </div>
  </div>
  <ol class="toc-list" id="toc-list"></ol>
</aside>
<div class="toc-mask" id="toc-mask"></div>

<!-- 排版设置 -->
<div class="rd-panel" id="rd-panel">
  <div class="rdp-row">
    <span class="rdp-label">字号</span>
    <div class="rdp-seg" id="seg-size">
      <button data-v="-1">A−</button><span id="val-size">19</span><button data-v="1">A+</button>
    </div>
  </div>
  <div class="rdp-row">
    <span class="rdp-label">行距</span>
    <div class="rdp-seg" id="seg-lh">
      <button data-v="1.7">紧</button><button data-v="1.95">适中</button><button data-v="2.2">松</button>
    </div>
  </div>
  <div class="rdp-row">
    <span class="rdp-label">版心</span>
    <div class="rdp-seg" id="seg-width">
      <button data-v="620">窄</button><button data-v="720">中</button><button data-v="840">宽</button>
    </div>
  </div>
  <div class="rdp-row">
    <span class="rdp-label">字体</span>
    <div class="rdp-seg" id="seg-font">
      <button data-v="serif" title="衬线（宋）">宋</button><button data-v="sans" title="无衬线（黑）">黑</button><button data-v="mono" title="等宽，只影响西文与数字">等宽</button><button data-v="shserif" title="思源宋体，本机装了才生效">思源</button>
    </div>
  </div>
  <div class="rdp-row">
    <span class="rdp-label">主题</span>
    <div class="rdp-seg" id="seg-theme">
      <button data-v="paper">纸白</button><button data-v="sepia">米黄</button><button data-v="night">夜</button>
    </div>
  </div>
</div>

<!-- 正文 -->
<main class="reader-main" id="reader-main" role="main">
  <div id="reader-state" class="reader-state">
    <div class="spinner ink"></div>
    <p class="small muted">正在打开…</p>
  </div>

  <!-- 阅读模式正文根：article + schema.org Article（详见 assets/js/read.js 的 updateArticleMeta）
       工具栏 / 目录抽屉 / 章节导航 / 页脚都刻意放在这个 article 之外。 -->
  <article id="reader-art" class="reader-art md-body hidden"
           itemscope itemtype="https://schema.org/Article" data-reader-root aria-label="正文">
    <!-- 归属书籍信息（对阅读模式与搜索引擎可见，视觉上不占位） -->
    <div class="vh" itemprop="isPartOf" itemscope itemtype="https://schema.org/Book">
      <meta itemprop="name" id="art-book-name">
      <meta itemprop="url" id="art-book-url">
      <meta itemprop="inLanguage" content="zh-CN">
    </div>
    <div class="vh" itemprop="author" itemscope itemtype="https://schema.org/Person">
      <meta itemprop="name" id="art-author">
    </div>
    <meta itemprop="inLanguage" content="zh-CN">
    <meta itemprop="dateModified" id="art-time" content="">

    <section id="chapter-wrap">
      <h1 class="chap-title" id="chap-title" itemprop="headline"></h1>
      <div id="chap-body" itemprop="articleBody"></div>
    </section>
  </article>

  <!-- 章节导航与页脚：刻意留在 article 外，阅读模式里只留正文。
       初始也给 .hidden，否则加载中会先露出两个空按钮（与改动前不一致）。 -->
  <div class="reader-extra hidden" id="reader-extra">
    <nav class="chap-nav" id="chap-nav" aria-label="章节导航">
      <button id="btn-prev" class="btn btn-sm">← 上一章</button>
      <button id="btn-toc2" class="btn btn-sm btn-ghost">目录</button>
      <button id="btn-next" class="btn btn-sm">下一章 →</button>
    </nav>

    <footer class="book-foot">
      <span>本页内容以密文形式存储于书籍仓库，由你的浏览器解密显示。</span>
    </footer>
  </div>
</main>

<script src="assets/js/config.js"></script>
<script src="assets/js/core/util.js"></script>
<script src="assets/js/core/inflate.js"></script>
<script src="assets/js/core/prefs.js"></script>
<script src="assets/js/core/crypto.js"></script>
<!-- Markdown 渲染：marked（GFM 全语法）+ DOMPurify（净化），本地优先 -->
<script src="assets/vendor/marked.min.js"></script>
<script src="assets/vendor/purify.min.js"></script>
<script src="assets/js/core/markdown.js"></script>
<script src="assets/js/core/net.js"></script>
<script src="assets/js/core/api.js"></script>
<script src="assets/js/core/auth.js"></script>
<script src="assets/js/core/fav.js"></script>
<script src="assets/js/core/nav.js"></script>
<script src="assets/js/read.js"></script>
<!-- 结构化数据：静态骨架即使 JS 未执行也能被解析，read.js 只负责填具体值 -->
<script type="application/ld+json" id="ld-article">{"@context":"https://schema.org","@type":"Article","inLanguage":"zh-CN","publisher":{"@type":"Organization","name":"群书阁","alternateName":"BookBlackNet"},"isPartOf":{"@type":"Book","inLanguage":"zh-CN"}}</script>
</body>
</html>
