<main class="page">
  <section class="wrap mgr">
    <div class="mgr-head">
      <h1 class="mgr-title">作品管理</h1>
      <p class="muted small mgr-sub">
        这里统一管三样东西：<strong>已发布的作品</strong>、<strong>账号里的云端草稿</strong>、<strong>你建的作品集</strong>。
        已发布的作品在任何设备登录后都能继续改 —— 优先用本机草稿，其次是账号云端，最后才从仓库把密文解回来。
      </p>
    </div>

    <div id="mgr-gate" class="mgr-gate hidden">
      <h2>登录后查看</h2>
      <p class="muted small">作品管理需要身份：发布的归属记在账号上，换设备才能把稿子找回来。</p>
      <div class="row gap-8">
        <button id="gate-login" class="btn btn-primary">登录账号</button>
        <button id="gate-gh" class="btn">直接跳到 GitHub 授权</button>
      </div>
    </div>

    <div id="mgr-body" class="hidden">
      <div class="mgr-stat" id="mgr-stat"></div>

      <h2 class="mgr-h2">已发布 <span class="mgr-count" id="cnt-pub">0</span></h2>
      <p class="muted small mgr-note" id="note-pub"></p>
      <div id="list-pub" class="mgr-grid"></div>

      <h2 class="mgr-h2">云端草稿 <span class="mgr-count" id="cnt-draft">0</span></h2>
      <p class="muted small mgr-note">存在账号里的书稿副本，用于换设备接着写；Gist 同步仍是主通道，这里的副本每 30 秒最多更新一次。</p>
      <div id="list-draft" class="mgr-grid"></div>

      <h2 class="mgr-h2">我的作品集 <span class="mgr-count" id="cnt-col">0</span></h2>
      <div class="row gap-8 mgr-colact">
        <a class="btn btn-sm" href="collections.html">去作品集页新建</a>
      </div>
      <div id="list-col" class="mgr-grid"></div>
    </div>
  </section>
</main>
