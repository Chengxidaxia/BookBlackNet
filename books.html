<main class="page">
  <section class="wrap lib-wrap">
    <div class="lib-head">
      <div>
        <h1 class="lib-title">全部书籍</h1>
        <p class="lib-sub" id="lib-sub">正在读取书目…</p>
      </div>
      <a class="btn btn-sm" href="index.html">返回首页</a>
    </div>

    <div class="lib-tools">
      <div class="lib-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="lib-q" type="search" placeholder="搜书名、作者、简介或标签…" autocomplete="off" aria-label="搜索书籍">
      </div>
      <div class="chips" id="lib-cats"></div>
      <select class="select select-sm" id="lib-sort" aria-label="排序方式">
        <option value="updated">最近更新</option>
        <option value="words">字数最多</option>
        <option value="title">书名</option>
        <option value="created">最新创建</option>
      </select>
    </div>

    <div class="book-grid" id="lib-grid">
      <div class="skel skel-card"></div>
      <div class="skel skel-card"></div>
      <div class="skel skel-card"></div>
      <div class="skel skel-card"></div>
      <div class="skel skel-card"></div>
      <div class="skel skel-card"></div>
    </div>

    <div class="lib-pager" id="lib-pager"></div>

    <div class="empty hidden" id="lib-empty">
      <div class="empty-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v18H6.5A2.5 2.5 0 0 1 4 18.5v-13z"/><path d="M8 7h7M8 11h5"/></svg>
      </div>
      <div class="empty-title" id="lib-empty-title">没有匹配的作品</div>
      <div class="empty-desc" id="lib-empty-desc">换个关键词，或者选「全部」分类看看。</div>
      <a class="btn btn-primary" href="index.html">返回书库</a>
    </div>
  </section>
</main>

<footer class="foot">
  <div class="wrap foot-in">
