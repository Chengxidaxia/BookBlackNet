    </div>
  </div>
</header>

<main class="page">
  <section class="wrap sh-wrap">
    <div class="sh-head">
      <div>
        <h1 class="sh-title">我的书架</h1>
        <p class="sh-sub" id="sh-state">正在读取…</p>
      </div>
      <div class="sh-acts">
        <button class="btn btn-sm" id="sh-sync" type="button">同步到账号</button>
        <a class="btn btn-primary btn-sm" href="index.html">去书库找书</a>
      </div>
    </div>

    <div class="sh-tabs" role="tablist">
      <button class="sh-tab on" type="button" data-tab="fav" role="tab">收藏<span class="sh-num" id="sh-fav-count">0</span></button>
      <button class="sh-tab" type="button" data-tab="recent" role="tab">最近阅读<span class="sh-num" id="sh-recent-count">0</span></button>
    </div>

    <!-- 收藏 -->
    <div id="sh-fav" class="book-grid"></div>
    <div id="sh-fav-empty" class="empty hidden">
      <div class="empty-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 20s-7-4.4-7-9.3A3.9 3.9 0 0 1 12 7.9 3.9 3.9 0 0 1 19 10.7C19 15.6 12 20 12 20z"/></svg>
      </div>
      <div class="empty-title">还没有收藏</div>
      <div class="empty-desc">在书籍详情页点「收藏」，书就会出现在这里。</div>
      <a class="btn btn-primary" href="index.html">去书库看看</a>
    </div>

    <!-- 最近阅读 -->
    <div id="sh-recent" class="sh-list hidden"></div>
    <div id="sh-recent-empty" class="empty hidden">
      <div class="empty-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v18H6.5A2.5 2.5 0 0 1 4 18.5v-13z"/><path d="M8 8h7M8 12h5"/></svg>
      </div>
      <div class="empty-title">还没有阅读记录</div>
      <div class="empty-desc">开始读一本书，进度会自动记在这里（可继续上次的位置）。</div>
      <a class="btn btn-primary" href="index.html">去书库</a>
    </div>
  </section>
</main>

<footer class="foot">
  <div class="wrap foot-in">
    <span class="brand-mark" style="width:22px;height:22px;border-radius:6px;font-size:12px">书</span>

  </div>
</footer>
